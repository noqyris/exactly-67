<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F6EEDF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Exactly 67</title>
  <!-- The sting is a portrait clip. On a wide screen (the unfolded iPhone Duo,
       an iPad in landscape) `cover` would show only its middle third: letterbox
       it on the black instead. Inline so it holds on the first painted frame. -->
  <style>@media (min-aspect-ratio: 3/4) { #splash-video { object-fit: contain !important } }</style>
</head>
<body>
  <!--
    Studio sting. Styled INLINE on purpose: this has to be correct on the very
    first painted frame, before any CSS chunk loads, or a cream flash shows
    through before the black video. `src/splash.ts` drives it; it dismisses on
    end, on tap, on any error, and on a hard timeout, so it can never strand the
    player. `muted` + `playsinline` are what let iOS autoplay it at all.
  -->
  <div id="splash" style="position:fixed;inset:0;background:#000;z-index:9999;opacity:0;transition:opacity .2s ease;overflow:hidden">
    <video id="splash-video" src="splash.mp4" muted playsinline autoplay preload="auto"
           style="width:100%;height:100%;object-fit:cover;display:block"></video>
    <div id="splash-skip"
         style="position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom, 0px) + 22px);text-align:center;color:rgba(255,255,255,.5);font:600 13px/1 system-ui,-apple-system,sans-serif;letter-spacing:.03em;opacity:0;transition:opacity .4s ease">Tap to skip</div>
  </div>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
